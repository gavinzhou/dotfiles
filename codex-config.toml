# Shared Codex settings. dot_codex/modify_private_config.toml.tmpl merges these into
# ~/.codex/config.toml; keys the Codex app writes (projects, desktop, hooks...)
# stay local. MCP secrets come from 1Password, never from this file.

model = "gpt-6.1-sol"
model_reasoning_effort = "low"
service_tier = "fast"

[features]
js_repl = false

[notice]
hide_rate_limit_model_nudge = true

[profiles.full-access]
sandbox_mode = "danger-full-access"
approval_policy = "never"

[mcp_servers.slack-official]
url = "https://mcp.slack.com/mcp"

[mcp_servers.slack-official.tools.slack_add_reaction]
approval_mode = "approve"

[mcp_servers.stitch]
url = "https://stitch.googleapis.com/mcp"

[marketplaces.diagram-design]
source_type = "git"
source = "https://github.com/cathrynlavery/diagram-design.git"

[marketplaces.claude-plugins-official]
source_type = "git"
source = "https://github.com/anthropics/claude-plugins-official.git"

[marketplaces.superpowers-marketplace]
source_type = "git"
source = "https://github.com/obra/superpowers-marketplace.git"

[plugins."documents@openai-primary-runtime"]
enabled = true

